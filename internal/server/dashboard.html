<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CI Radar</title><style>
:root{color-scheme:dark;--bg:#0a0d12;--panel:#111722;--line:#283244;--text:#e8edf6;--muted:#93a1b5;--good:#3ddc97;--warn:#ffcb6b;--bad:#ff667a;--accent:#8ba7ff}*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:var(--bg);color:var(--text)}header{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;position:sticky;top:0;background:#0a0d12ee;backdrop-filter:blur(8px)}h1{font-size:20px;margin:0;margin-right:auto}input,select,button{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:9px 11px;border-radius:8px}input{min-width:250px}button{cursor:pointer}main{padding:22px;max-width:1500px;margin:auto}.grid{display:grid;grid-template-columns:repeat(8,minmax(120px,1fr));gap:12px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px}.card b{font-size:25px;display:block;margin-top:8px}.muted{color:var(--muted)}.two{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-top:14px}.panel h2{font-size:15px;margin:0 0 12px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:600}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 7px;font-size:12px}.EXTERNAL,.open{color:var(--bad)}.CODE,.resolved{color:var(--good)}.MIXED,.acknowledged{color:var(--warn)}#error{color:var(--bad);margin:10px 0}.actions button{padding:5px 8px;margin-right:4px}@media(max-width:950px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}header{flex-wrap:wrap}input{min-width:180px}}
</style></head><body><header><h1>CI Radar</h1><input id="token" type="password" placeholder="Admin token or API key"><input id="tenant" placeholder="Tenant" value="default"><select id="range"><option value="24h">24 hours</option><option value="168h" selected>7 days</option><option value="720h">30 days</option></select><button onclick="load()">Load</button></header><main><div id="error"></div><section class="grid" id="cards"></section><section class="two"><div class="panel"><h2>Active incidents</h2><table><thead><tr><th>Incident</th><th>State</th><th>Impact</th><th>Actions</th></tr></thead><tbody id="incidents"></tbody></table></div><div class="panel"><h2>Categories</h2><table><tbody id="categories"></tbody></table></div></section><section class="panel" style="margin-top:14px"><h2>Recent diagnoses</h2><table><thead><tr><th>Time</th><th>Attribution</th><th>Category</th><th>Provider</th><th>Score</th><th>Summary</th></tr></thead><tbody id="analyses"></tbody></table></section><section class="two"><div class="panel"><h2>Repository routing</h2><table><thead><tr><th>Repository</th><th>Team</th><th>Criticality</th><th>Channels</th></tr></thead><tbody id="repositories"></tbody></table></div><div class="panel"><h2>Notification deliveries</h2><table><thead><tr><th>Channel</th><th>Status</th><th>Attempts</th><th>Last error</th></tr></thead><tbody id="deliveries"></tbody></table></div></section></main><script>
const $=id=>document.getElementById(id);$('token').value=sessionStorage.ciradarToken||'';$('tenant').value=sessionStorage.ciradarTenant||'default';
async function api(path,opt={}){const token=$('token').value.trim(),tenant=$('tenant').value.trim()||'default';sessionStorage.ciradarToken=token;sessionStorage.ciradarTenant=tenant;opt.headers={...(opt.headers||{}),'Authorization':'Bearer '+token,'X-CI-Radar-Tenant':tenant,'Content-Type':'application/json'};const r=await fetch(path,opt);if(!r.ok)throw new Error((await r.json().catch(()=>({error:r.statusText}))).error);return r.status===204?null:r.json()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function pairs(o){return Object.entries(o||{}).sort((a,b)=>b[1]-a[1])}
async function load(){try{$('error').textContent='';const [d,repos,notifs]=await Promise.all([api('/api/v1/dashboard?range='+encodeURIComponent($('range').value)),api('/api/v1/repositories'),api('/api/v1/notifications/deliveries?limit=12')]);const cards=[['Diagnoses',d.total_analyses],['External',d.external_analyses],['Code',d.code_analyses],['Mixed',d.mixed_analyses],['Toolchain',d.toolchain_analyses],['Open incidents',d.open_incidents],['Critical',d.critical_incidents],['Alert failures',d.notification_failures]];$('cards').innerHTML=cards.map(x=>`<div class=card><span class=muted>${esc(x[0])}</span><b>${x[1]}</b></div>`).join('');$('categories').innerHTML=pairs(d.categories).map(x=>`<tr><td>${esc(x[0])}</td><td>${x[1]}</td></tr>`).join('');$('incidents').innerHTML=(d.recent_incidents||[]).filter(x=>x.state!=='resolved').map(x=>`<tr><td><b>${esc(x.title)}</b><div class=muted>${esc(x.provider)} · ${esc(x.severity)} · ${esc(x.attribution)}</div></td><td><span class="pill ${esc(x.state)}">${esc(x.state)}</span></td><td>${x.repository_count} repos<br>${x.occurrence_count} occurrences</td><td class=actions><button onclick="state('${x.fingerprint}','acknowledge')">Ack</button><button onclick="state('${x.fingerprint}','resolve')">Resolve</button></td></tr>`).join('')||'<tr><td colspan=4 class=muted>No active incidents</td></tr>';$('analyses').innerHTML=(d.recent_analyses||[]).map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td><span class="pill ${esc(x.attribution)}">${esc(x.attribution)}</span></td><td>${esc(x.category)}</td><td>${esc(x.provider)}</td><td title="raw ${x.raw_score}; +${x.positive_score} ${x.negative_score}">${x.score}</td><td>${esc(x.summary)}</td></tr>`).join('');$('repositories').innerHTML=(repos.repositories||[]).map(x=>`<tr><td>${esc(x.repository)}</td><td>${esc(x.team||x.owner||'—')}</td><td><span class=pill>${esc(x.criticality)}</span></td><td>${esc((x.notification_channels||[]).join(', ')||'default')}</td></tr>`).join('')||'<tr><td colspan=4 class=muted>No repository profiles</td></tr>';$('deliveries').innerHTML=(notifs.deliveries||[]).map(x=>`<tr><td>${esc(x.channel)}</td><td><span class=pill>${esc(x.status)}</span></td><td>${x.attempts}</td><td>${esc(x.last_error||x.suppressed_reason||'—')}</td></tr>`).join('')||'<tr><td colspan=4 class=muted>No deliveries</td></tr>'}catch(e){$('error').textContent=e.message}}
async function state(fp,action){try{await api('/api/v1/incidents/'+fp+'/'+action,{method:'POST',body:'{}'});load()}catch(e){$('error').textContent=e.message}}setInterval(()=>{if($('token').value)load()},30000);if($('token').value)load();
</script></body></html>
