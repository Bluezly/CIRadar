name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: false
      - name: Repository hygiene
        run: ./scripts/repo-check.sh
      - name: Unit and integration tests
        run: go test -count=1 ./...
      - name: Race detector
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.1
          staticcheck ./...
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
      - name: Benchmark harness smoke test
        run: go run ./cmd/ciradar benchmark --dataset benchmarks/example/dataset.json --split test --min-cases 3 --min-category-accuracy 1 --min-macro-f1 1 --min-coverage 0.66 --max-unknown-rate 0.34

  postgres-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: ciradar
          POSTGRES_PASSWORD: ciradar_test_password
          POSTGRES_DB: ciradar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ciradar -d ciradar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: false
      - name: PostgreSQL integration and migrations
        env:
          CIRADAR_TEST_POSTGRES_DSN: postgres://ciradar:ciradar_test_password@127.0.0.1:5432/ciradar_test?sslmode=disable&pool_max_conns=4
        run: go test -count=1 -run TestPostgresIntegration ./internal/db

  build:
    needs: [verify, postgres-integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            output: CIRadar-Windows-x64.exe
          - goos: windows
            goarch: arm64
            output: CIRadar-Windows-arm64.exe
          - goos: linux
            goarch: amd64
            output: ciradar-linux-x64
          - goos: linux
            goarch: arm64
            output: ciradar-linux-arm64
          - goos: darwin
            goarch: amd64
            output: ciradar-darwin-x64
          - goos: darwin
            goarch: arm64
            output: ciradar-darwin-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: false
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: >-
          go build -buildvcs=false -trimpath
          -ldflags "-s -w -X ciradar/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          -X ciradar/internal/version.Commit=${GITHUB_SHA::12}"
          -o "${{ matrix.output }}" ./cmd/ciradar
      - name: Checksum
        run: sha256sum "${{ matrix.output }}" > "${{ matrix.output }}.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.output }}
          path: |
            ${{ matrix.output }}
            ${{ matrix.output }}.sha256

  checksums:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Aggregate checksums
        run: |
          cd dist
          sha256sum CIRadar-Windows-x64.exe CIRadar-Windows-arm64.exe ciradar-linux-x64 ciradar-linux-arm64 ciradar-darwin-x64 ciradar-darwin-arm64 > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
