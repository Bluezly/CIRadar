name: CI Radar CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Test with race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Install Staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2024.1.1
      - name: Staticcheck
        run: staticcheck ./...
      - name: Dashboard syntax
        run: node --check internal/server/dashboard.js
      - name: Configuration syntax
        run: python3 -m json.tool ciradar.example.json >/dev/null
      - name: Benchmark harness smoke test
        run: go run ./cmd/ciradar benchmark --dataset benchmarks/example/dataset.json --split test --min-cases 3 --min-category-accuracy 1 --min-macro-f1 1 --min-coverage 0.66 --max-unknown-rate 0.34

  postgres-integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: ciradar
          POSTGRES_PASSWORD: ciradar_test_password
          POSTGRES_DB: ciradar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ciradar -d ciradar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: PostgreSQL integration and migration test
        env:
          CIRADAR_TEST_POSTGRES_DSN: postgres://ciradar:ciradar_test_password@127.0.0.1:5432/ciradar_test?sslmode=disable&pool_max_conns=4
        run: go test -count=1 -run TestPostgresIntegration ./internal/db

  build:
    needs: [verify, postgres-integration]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            output: CIRadar-Windows-x64.exe
          - goos: windows
            goarch: arm64
            output: CIRadar-Windows-arm64.exe
          - goos: linux
            goarch: amd64
            output: ciradar-linux-x64
          - goos: linux
            goarch: arm64
            output: ciradar-linux-arm64
          - goos: darwin
            goarch: amd64
            output: ciradar-darwin-x64
          - goos: darwin
            goarch: arm64
            output: ciradar-darwin-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: >-
          go build -buildvcs=false -trimpath
          -ldflags "-s -w -X ciradar/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          -X ciradar/internal/version.Commit=${GITHUB_SHA::12}"
          -o "${{ matrix.output }}" ./cmd/ciradar
      - name: Per-binary checksum
        run: sha256sum "${{ matrix.output }}" > "${{ matrix.output }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: |
            ${{ matrix.output }}
            ${{ matrix.output }}.sha256

  checksums:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Aggregate release checksums
        run: |
          cd dist
          sha256sum CIRadar-Windows-x64.exe CIRadar-Windows-arm64.exe ciradar-linux-x64 ciradar-linux-arm64 ciradar-darwin-x64 ciradar-darwin-arm64 > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
