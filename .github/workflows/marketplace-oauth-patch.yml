name: Marketplace OAuth patch

on:
  push:
    branches:
      - agent/marketplace-oauth-setup

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/marketplace-oauth-setup
          fetch-depth: 0

      - name: Wire Marketplace OAuth setup
        shell: python
        run: |
          from pathlib import Path
          import json

          server = Path('internal/server/server.go')
          text = server.read_text()
          needle = 'mux.HandleFunc("GET /auth/login", s.authLogin)\n'
          replacement = needle + 'mux.HandleFunc("GET /github/marketplace/setup", s.marketplaceSetup)\n' + 'mux.HandleFunc("GET /github/marketplace/callback", s.marketplaceCallback)\n'
          if 'GET /github/marketplace/setup' not in text:
              if needle not in text:
                  raise SystemExit('server route anchor not found')
              text = text.replace(needle, replacement, 1)
              server.write_text(text)

          config = Path('internal/config/config.go')
          text = config.read_text()
          needle = '''\tif c.GitHubMarketplace.Enabled {\n\t\tif err := resolve("github_marketplace.webhook_secret", &c.GitHubMarketplace.WebhookSecret); err != nil {\n\t\t\treturn err\n\t\t}\n\t}\n'''
          replacement = '''\tif c.GitHubMarketplace.Enabled {\n\t\tif err := resolve("github_marketplace.webhook_secret", &c.GitHubMarketplace.WebhookSecret); err != nil {\n\t\t\treturn err\n\t\t}\n\t\tif err := resolve("github_marketplace.oauth_client_secret", &c.GitHubMarketplace.OAuthClientSecret); err != nil {\n\t\t\treturn err\n\t\t}\n\t}\n'''
          if 'github_marketplace.oauth_client_secret' not in text:
              if needle not in text:
                  raise SystemExit('config secret anchor not found')
              text = text.replace(needle, replacement, 1)
              config.write_text(text)

          example = Path('ciradar.example.json')
          data = json.loads(example.read_text())
          marketplace = data['github_marketplace']
          ordered = {}
          for key, value in marketplace.items():
              ordered[key] = value
              if key == 'webhook_secret':
                  ordered['oauth_client_id'] = ''
                  ordered['oauth_client_secret'] = 'env:CIRADAR_MARKETPLACE_OAUTH_CLIENT_SECRET'
          data['github_marketplace'] = ordered
          example.write_text(json.dumps(data, indent=2) + '\n')

          workflow = Path('.github/workflows/marketplace-oauth-patch.yml')
          workflow.unlink()

      - name: Format and test
        run: |
          gofmt -w internal/config/marketplace.go internal/server/marketplace_oauth.go internal/server/server.go internal/config/config.go
          go test ./internal/config ./internal/marketplace ./internal/server

      - name: Commit wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "wire Marketplace OAuth setup flow"
          git push origin HEAD:agent/marketplace-oauth-setup
