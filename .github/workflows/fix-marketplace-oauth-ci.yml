name: Fix Marketplace OAuth CI

on:
  push:
    branches:
      - agent/marketplace-oauth-setup

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/marketplace-oauth-setup
          fetch-depth: 0
      - name: Remove disallowed line comments
        shell: python
        run: |
          from pathlib import Path
          path = Path('internal/server/marketplace_oauth.go')
          text = path.read_text()
          text = text.replace('\t// GitHub App user access tokens use the app\'s fine-grained permissions,\n\t// not OAuth scopes. The token is used only to verify installation access.\n', '')
          path.write_text(text)
          Path('.github/workflows/fix-marketplace-oauth-ci.yml').unlink()
      - name: Validate
        run: |
          gofmt -w internal/server/marketplace_oauth.go internal/server/marketplace_oauth_test.go
          ./scripts/repo-check.sh
          go test ./internal/config ./internal/marketplace ./internal/server
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix Marketplace OAuth repository checks"
          git push origin HEAD:agent/marketplace-oauth-setup
