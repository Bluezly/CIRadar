name: Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.1.0"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: ciradar
          POSTGRES_PASSWORD: ciradar_release_test
          POSTGRES_DB: ciradar_release_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ciradar -d ciradar_release_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.6"
          cache: true

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

          echo "Release version: $VERSION"

      - name: Repository checks
        run: ./scripts/repo-check.sh

      - name: Unit tests
        run: go test -count=1 ./...

      - name: Race detector
        run: go test -race -count=1 ./...

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.1
          staticcheck ./...

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

      - name: PostgreSQL release integration
        env:
          CIRADAR_TEST_POSTGRES_DSN: postgres://ciradar:ciradar_release_test@127.0.0.1:5432/ciradar_release_test?sslmode=disable&pool_max_conns=4
        run: |
          go test \
            -count=1 \
            -run TestPostgresIntegration \
            ./internal/db

      - name: Build release assets
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          COMMIT="${SOURCE_COMMIT:0:12}"

          VERSION="$VERSION" \
          BUILD_DATE="$BUILD_DATE" \
          COMMIT="$COMMIT" \
          ./scripts/build.sh

          git archive \
            --format=zip \
            --prefix="CIRadar-${VERSION}-Source/" \
            -o "dist/CIRadar-${VERSION}-Source.zip" \
            "$SOURCE_COMMIT"

          cd dist

          sha256sum \
            CIRadar-Windows-x64.exe \
            CIRadar-Windows-arm64.exe \
            ciradar-linux-x64 \
            ciradar-linux-arm64 \
            ciradar-darwin-x64 \
            ciradar-darwin-arm64 \
            "CIRadar-${VERSION}-Source.zip" \
            > SHA256SUMS

      - name: Verify binaries
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          test -s dist/CIRadar-Windows-x64.exe
          test -s dist/CIRadar-Windows-arm64.exe
          test -s dist/ciradar-linux-x64
          test -s dist/ciradar-linux-arm64
          test -s dist/ciradar-darwin-x64
          test -s dist/ciradar-darwin-arm64
          test -s "dist/CIRadar-${VERSION}-Source.zip"
          test -s dist/SHA256SUMS

          chmod +x dist/ciradar-linux-x64

          OUTPUT="$(dist/ciradar-linux-x64 version)"

          echo "$OUTPUT"
          echo "$OUTPUT" | grep -F "$VERSION"

      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            dist/CIRadar-Windows-x64.exe
            dist/CIRadar-Windows-arm64.exe
            dist/ciradar-linux-x64
            dist/ciradar-linux-arm64
            dist/ciradar-darwin-x64
            dist/ciradar-darwin-arm64
            dist/CIRadar-${{ steps.version.outputs.version }}-Source.zip
            dist/SHA256SUMS

      - name: Create tag for manual release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          TARGET_SHA="$(git rev-parse HEAD)"

          if gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" \
            >/dev/null 2>&1
          then
            CURRENT_SHA="$(gh api \
              "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" \
              --jq '.object.sha')"

            if [[ "$CURRENT_SHA" == "$TARGET_SHA" ]]; then
              echo "Tag ${TAG} already points to ${TARGET_SHA}."
            else
              echo "Moving ${TAG} from ${CURRENT_SHA} to ${TARGET_SHA} for an explicit manual republish."
              gh api \
                --method PATCH \
                "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
                -f sha="${TARGET_SHA}" \
                -F force=true
            fi
          else
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${TAG}" \
              -f sha="${TARGET_SHA}"
          fi

      - name: Recreate GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; deleting the old release before republishing."
            gh release delete "$TAG" --yes
          fi

          echo "Creating a fresh release for ${TAG}."
          gh release create "$TAG" \
            dist/CIRadar-Windows-x64.exe \
            dist/CIRadar-Windows-arm64.exe \
            dist/ciradar-linux-x64 \
            dist/ciradar-linux-arm64 \
            dist/ciradar-darwin-x64 \
            dist/ciradar-darwin-arm64 \
            "dist/CIRadar-${VERSION}-Source.zip" \
            dist/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "CI Radar ${VERSION}"
