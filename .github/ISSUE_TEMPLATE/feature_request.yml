name: Feature request
description: Propose a focused product improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the operational problem before proposing a solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: scope
    attributes:
      label: Primary area
      options:
        - Diagnosis engine
        - CI connector
        - PostgreSQL or storage
        - Test intelligence
        - Notifications or ChatOps
        - Security or SSO
        - Dashboard
        - MCP or API
        - Documentation
        - Other
