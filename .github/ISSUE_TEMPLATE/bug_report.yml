name: Bug report
description: Report a reproducible CI Radar defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove credentials, tokens, private repository names, and raw secrets before submitting logs.
  - type: input
    id: version
    attributes:
      label: CI Radar version
      placeholder: Paste the output of `ciradar version`
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment mode
      options:
        - Embedded database
        - PostgreSQL
        - Docker Compose
        - Standalone binary
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the expected result and the actual result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: sanitized_logs
    attributes:
      label: Sanitized logs
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed secrets and private identifiers.
          required: true
        - label: I searched existing issues.
          required: true
