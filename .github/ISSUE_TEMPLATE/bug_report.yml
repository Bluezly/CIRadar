name: Bug report
description: Something is not working
title: ""
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `ciradar version`
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Tell us what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Please remove tokens, private repository names, and other sensitive data first.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed secrets and private identifiers from the report.
          required: true
